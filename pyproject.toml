[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custintel"
version = "0.1.0"
description = "Customer Segmentation, Next-Best-Action and Banner Ranking Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Bhavya Gupta"}]

dependencies = [
    "duckdb",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "streamlit",
    "scipy",
    "statsmodels",
    "optuna",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyter",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/custintel"]
omit = ["src/custintel/__main__.py"]
addopts = "-v --tb=short"
